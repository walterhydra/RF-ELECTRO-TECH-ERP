services:
  - type: web
    name: rf-electro-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: rf-electro-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

databases:
  - name: rf-electro-db
    region: singapore
    plan: free
